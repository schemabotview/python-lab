<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Python Lab — Python exercises that run entirely in your browser, on a real CPython interpreter. Nothing to install."
    />
    <title>Python Lab — exercises in the browser</title>
    <!-- Applies a stored theme choice BEFORE first paint. This has to be inline and blocking: as a
         module or a deferred file it would run after the page has already painted, and every load
         would flash the wrong background. Ported from ui-graphl/index.html, which does the same for
         the same reason. Deliberately tiny and dependency-free; lib/theme.ts owns everything after.
         The default here is dark (the lab has no authored deck theme to defer to). -->
    <script>
      try {
        var t = localStorage.getItem('graphl:theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
